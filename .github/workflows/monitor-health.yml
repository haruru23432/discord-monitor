name: Monitor Health Check

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      test_mention:
        description: "Send one labeled mention test without changing monitor state"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: monitor-health-check
  cancel-in-progress: false
  queue: max

jobs:
  health:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify health notification safety
        run: python3 -m unittest test_health -b -q
      - name: Check scheduled monitors
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
          TEST_MENTION: ${{ inputs.test_mention || false }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 monitor_health.py
