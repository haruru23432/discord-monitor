name: Important Information Monitor

on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: important-information-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check important information
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISCORD_WEBHOOK_IMPORTANT: ${{ secrets.DISCORD_WEBHOOK_IMPORTANT }}
        shell: python
        run: |
          """Free, standard-library-only supplemental monitor. Never writes legacy state."""
          import base64
          import copy
          import hashlib
          import html
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          
          BRANCH, STATE_PATH = 'important-monitor-state', 'important-state.json'
          DAY = 86400
          GAMES = {'dbd': 381210, 'ow': 2357570, 'apex': 1172470}
          NAMES = {'windows': 'Windows 11', 'dbd': 'Dead by Daylight', 'ow': 'Overwatch',
                   'apex': 'Apex Legends', 'discord': 'Discord', 'steam': 'Steam', 'medal': 'Medal.tv'}
          SOURCES = [
              {'id': 'windows-official', 'topic': 'windows', 'url': 'https://blogs.windows.com/windowsexperience/feed/', 'kind': 'rss', 'official': True},
              {'id': 'windows-latest', 'topic': 'windows', 'url': 'https://www.windowslatest.com/feed/', 'kind': 'rss', 'official': False},
              {'id': 'discord-official', 'topic': 'discord', 'url': 'https://discord.com/blog/rss.xml', 'kind': 'rss', 'official': True},
              {'id': 'steam-official', 'topic': 'steam', 'url': 'https://store.steampowered.com/feeds/news/group/4145017', 'kind': 'rss', 'official': True},
              {'id': 'medal-official', 'topic': 'medal', 'url': 'https://medal.tv/blog/categories/features', 'kind': 'medal', 'official': True},
          ] + [{'id': topic + ('-official' if feed == 'steam_community_announcements' else '-pcgamer'),
                'topic': topic, 'kind': 'steam', 'official': feed == 'steam_community_announcements', 'feed': feed,
                'url': 'https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?' + urllib.parse.urlencode(
                    {'appid': appid, 'count': 100, 'maxlength': 0, 'feeds': feed})}
               for topic, appid in GAMES.items() for feed in ('steam_community_announcements', 'pcgamer')]
          
          
          def clean(text):
              return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>|\[[^\]]+\]', ' ', text))).strip()
          
          
          def digest(text):
              return hashlib.sha256(text.encode()).hexdigest()
          
          
          def canonical(url):
              p = urllib.parse.urlsplit(html.unescape(url))
              if p.scheme != 'https' or not p.hostname or p.username or p.password:
                  raise ValueError('Unsafe article URL')
              query = urllib.parse.urlencode([(k, v) for k, v in urllib.parse.parse_qsl(p.query)
                                             if not k.startswith('utm_') and k not in ('ref', 'source')])
              return urllib.parse.urlunsplit(('https', p.netloc.lower(), p.path.rstrip('/'), query, p.fragment))
          
          
          def request(url, data=None, headers=None, method=None):
              req = urllib.request.Request(url, data=None if data is None else json.dumps(data).encode(),
                  headers={'User-Agent': 'ImportantNewsMonitor/1.0', 'Content-Type': 'application/json', **(headers or {})}, method=method)
              # Do not forward credentials through redirects, including webhook redirects.
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect()) if data is not None or headers else urllib.request.build_opener()
              with opener.open(req, timeout=25) as response:
                  raw = response.read(5_000_001)
                  if len(raw) > 5_000_000:
                      raise ValueError('Response too large')
                  return raw.decode('utf-8')
          
          
          def article(source, title, url, body='', date=None, gid=None):
              url = canonical(url)
              return dict(topic=source['topic'], source=source['id'], official=source['official'],
                          title=clean(title), url=url, body=body, date=date, gid=str(gid or url))
          
          
          def parse_rss(raw, source):
              root = ET.fromstring(raw)
              rows = root.findall('./channel/item')
              if not rows:
                  raise ValueError('RSS layout changed or empty')
              result = []
              for row in rows:
                  title, url, published = (row.findtext(k) for k in ('title', 'link', 'pubDate'))
                  if not title or not url or not published:
                      raise ValueError('RSS field missing')
                  date = int(parsedate_to_datetime(published).timestamp())
                  # Trust only articles on the source domain (Steam RSS uses the same domain).
                  if urllib.parse.urlsplit(url).hostname != urllib.parse.urlsplit(source['url']).hostname:
                      raise ValueError('Unexpected feed article domain')
                  result.append(article(source, title, url, row.findtext('description') or '', date))
              return result
          
          
          def parse_medal(raw, source):
              result = []
              for match in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', raw, re.S):
                  url = urllib.parse.urljoin(source['url'], html.unescape(match[1]))
                  if urllib.parse.urlsplit(url).hostname != 'medal.tv' or '/blog/posts/' not in url:
                      continue
                  heading = re.search(r'<h[1-6][^>]*>(.*?)</h[1-6]>', match[2], re.S)
                  title = clean(heading[1] if heading else match[2])
                  if title and title.lower() != 'read more':
                      result.append(article(source, title, url))
              if not result:
                  raise ValueError('Medal blog layout changed or empty')
              return result
          
          
          def fetch_source(source, now):
              raw = request(source['url'])
              if source['kind'] == 'rss':
                  return parse_rss(raw, source)
              if source['kind'] == 'medal':
                  result = parse_medal(raw, source)
                  logs = sorted({r['url'] for r in result if 'changelog' in r['url']}, reverse=True)[:2]
                  for url in logs:
                      result.extend(parse_changelog(request(url), source, url))
                  return result
              result, end = [], now + 1
              for page in range(10):
                  if page:
                      raw = request(source['url'] + '&enddate=' + str(end))
                  obj = json.loads(raw)['appnews']
                  if int(obj['appid']) != GAMES[source['topic']]:
                      raise ValueError('Wrong Steam app')
                  rows = obj['newsitems']
                  for row in rows:
                      if row['feedname'] == source['feed']:
                          result.append(article(source, row['title'], row['url'], row.get('contents', ''), int(row['date']), row['gid']))
                  if len(rows) < 100 or min(int(r['date']) for r in rows) < now - 14 * DAY:
                      if not result and source['official']:
                          raise ValueError('Empty official Steam feed')
                      return result
                  next_end = min(int(r['date']) for r in rows) - 1
                  if next_end >= end:
                      raise ValueError('Steam pagination did not advance')
                  end = next_end
              raise ValueError('Steam backlog exceeds safe limit')
          
          
          def parse_changelog(raw, source, url):
              # Annual pages are updated in place: identify individual dated sections.
              parts = re.split(r'<h1\b[^>]*>(.*?)</h1>', raw, flags=re.S)
              result = []
              for index in range(1, len(parts), 2):
                  match = re.search(r'([A-Z][a-z]+ \d{1,2}, \d{4}) Changelog', clean(parts[index]))
                  if not match:
                      continue
                  day = datetime.strptime(match[1], '%B %d, %Y').replace(tzinfo=timezone.utc)
                  section = parts[index + 1]
                  # Feature headings, not a generic annual changelog title, drive classification.
                  headings = ' '.join(clean(h) for h in re.findall(r'<h[2-6]\b[^>]*>(.*?)</h[2-6]>', section, re.S))
                  identity = url + '#' + day.strftime('%Y-%m-%d')
                  result.append(article(source, 'Medal ' + headings, url, clean(section)[:1600], int(day.timestamp()), identity))
              if not result:
                  raise ValueError('Medal changelog layout changed')
              return result
          
          
          def classify(item):
              title, body = item['title'].lower(), clean(item['body'])[:1600].lower()
              topic = item['topic']
              if re.search(r'\b(rumou?r|leak|speculation|weekly|roundup|recap|sale|discount|giveaway|survey|contest|esports|tournament)\b|how to|best .{0,30}(?:software|settings)|使い方|セール', title):
                  return None
              if topic == 'windows' and not re.search(r'windows\s*11', title + ' ' + body):
                  return None
              serious = re.search(r'boot loop|unbootable|blue screen|black screen|bsod|data loss|data corruption|actively exploited|major outage|widespread outage|重大.{0,10}(?:不具合|障害)', title)
              broken = re.search(r'(?:breaks?|kills?|disables?|stops? working|unusable|cannot|unable|crash|fail|broken|使用不能|接続不能)', title)
              function = re.search(r'audio|microphone|sound|desktop|taskbar|start menu|wsl|remote desktop|games?|recording|clips?|login|sign.in|voice|streaming|音声|マイク|録画', title)
              if serious or (broken and function):
                  if topic != 'windows' or re.search(r'update|kb\d+|更新', title + ' ' + body):
                      return '重大な不具合・利用への影響'
              if re.search(r'\b(hotfix|bugfix|minor|maintenance|beta|insider|preview)\b|小規模|メンテナンス', title):
                  return None
              if topic in GAMES:
                  for label, pattern in [
                      ('新キャラクター・主要コンテンツ', r'new (?:killer|survivor|hero|legend|map|weapon)|new chapter|\bdlc\b|新キャラ|新キラー|新サバイバー'),
                      ('コラボ', r'crossover|collaboration|\bcollab\b|\s[x×]\s|コラボ'),
                      ('期間限定イベント', r'limited.time|collection event|anniversary|\bevent\b|期間限定|イベント'),
                      ('大型更新・重要なゲーム変更', r'new season|season \d+|major update|overhaul|rework|ranked changes|ranked update|新シーズン|大型更新|大幅変更')]:
                      if re.search(pattern, title):
                          return label
                  if re.search(r'introduc|announc|reveal|launch', title) and re.search(r'new (?:hero|legend|killer|survivor|map)|crossover', body[:600]):
                      return '新キャラクター・主要コンテンツ'
                  return None
              if re.search(r'end.{0,12}support|no longer support|system requirements|mandatory|age verification|privacy.{0,30}(?:change|new)|サポート終了|必須|仕様変更', title):
                  return '重要な仕様・対応条件の変更'
              if topic == 'medal' and re.search(r'longer uploads|upload limits|recording limits|privacy and security|new.{0,12}overlay', title):
                  return '録画・共有機能やプライバシーの重要変更'
              if topic == 'windows' and re.search(r'windows 11.{0,30}(?:\d{2}h[12]|feature update)', title) and re.search(r'available|roll|release|配信', title):
                  return 'Windows大型機能更新'
              if re.search(r'introducing|launch|roll.{0,4}out|now available|new feature|major update|新機能|大型アップデート', title):
                  if re.search(r'record|shar|famil|voice|video|stream|chat|overlay|security|privacy|accessib|backup|録画|共有|音声|セキュリティ', title + ' ' + body[:600]):
                      return '主要機能の追加・変更'
              return None
          
          
          def keys(item):
              title = re.sub(r'\W+', '', clean(item['title']).casefold())
              # Multiple dated entries can share an annual changelog page URL.
              identity_url = item['gid'] if '/medal-changelog-' in item['url'] else item['url']
              result = {'gid:' + item['gid'], 'title:' + digest(title), 'url:' + canonical(identity_url)}
              urls = [item['url']] + re.findall(r'https?://[^\s<>"\'\]\)]+', html.unescape(item['body']))
              for url in urls:
                  p = urllib.parse.urlsplit(url.rstrip('.,;'))
                  host = (p.hostname or '').removeprefix('www.')
                  match = re.search(r'/(?:announcements/detail|detail)/(\d+)', p.path)
                  if host == 'steamcommunity.com' and match:
                      result.add('steam:' + match[1])
                  patterns = {'deadbydaylight.com': r'/(?:[a-z]{2}/)?news/([^/]+)',
                              'ea.com': r'/games/apex-legends/(?:apex-legends/)?news/([^/]+)',
                              'overwatch.blizzard.com': r'/(?:news|overwatch)/(?:(?:en-us|ja-jp)/)?(\d+)',
                              'news.blizzard.com': r'/(?:news|overwatch)/(?:(?:en-us|ja-jp)/)?(\d+)'}
                  if host in patterns:
                      match = re.search(patterns[host], p.path)
                      if match:
                          result.add('official:' + match[1].lower())
              return result
          
          
          def legacy_duplicate(item, legacy):
              if item['topic'] in GAMES:
                  old = legacy[item['topic']]
                  # "seen" also contains rejected news; only sent/baselined aliases suppress it.
                  return bool(keys(item) & set(old['sent']))
              if item['topic'] == 'windows':
                  normalized = re.sub(r'[^a-z0-9]+', ' ', item['title'].lower()).strip()
                  aliases = {'url:' + digest(item['url']), 'title:' + digest(normalized)}
                  words = set(re.findall(r'[a-z]{4,}', item['title'].lower()))
                  kbs = set(re.findall(r'KB\d{6,8}', (item['title'] + ' ' + clean(item['body'])).upper()))
                  for old in legacy['windows']['incidents']:
                      if aliases & set(old['keys']):
                          return True
                      other = set(old['words'])
                      if kbs & set(old['kbs']) and len(words & other) / max(1, len(words | other)) >= .55:
                          return True
              return False
          
          
          def plan(state, batches, legacy, now):
              state = copy.deepcopy(state)
              candidates = []
              for source, items in sorted(batches, key=lambda b: not b[0]['official']):
                  baseline = source['id'] not in state['sources']
                  record = state['sources'].setdefault(source['id'], {'started': now, 'seen': {}})
                  for item in items:
                      identity = digest(item['gid'])
                      if identity in record['seen']:
                          continue
                      first = state['discovered'].setdefault(source['id'] + ':' + identity, now)
                      published = item['date'] if item['date'] is not None else first
                      if baseline or published <= record['started'] or published < now - 14 * DAY:
                          record['seen'][identity] = now
                          continue
                      if published > now:
                          continue
                      # Give existing monitors a full day; defer auxiliary Windows news for six hours.
                      delay = DAY if item['topic'] in GAMES else (6 * 3600 if item['topic'] == 'windows' else 0)
                      if now - published < delay:
                          continue
                      label = classify(item)
                      scoped = {item['topic'] + ':' + key for key in keys(item)}
                      if not label or scoped & set(state['sent']) or legacy_duplicate(item, legacy):
                          record['seen'][identity] = now
                          continue
                      if len(candidates) >= 5:
                          continue
                      candidates.append((item, label, sorted(scoped)))
                      state['sent'].extend(sorted(scoped))
                      record['seen'][identity] = now
              return state, candidates
          
          
          def embed(item, label):
              return {'title': (NAMES[item['topic']] + '：' + item['title'])[:256], 'url': item['url'],
                      'description': '分類：' + label + '\n情報源：' + ('公式' if item['official'] else ('Windows Latest' if item['topic'] == 'windows' else 'PC Gamer') + '（外部報道）') +
                      '\n\n詳細・対象環境はリンク先で確認してください。', 'color': 15158332 if '不具合' in label else 3447003}
          
          
          def collect(now):
              def get(source):
                  try:
                      return source, fetch_source(source, now), None
                  except Exception as error:
                      # Never print exception text: network exceptions can contain credentials.
                      return source, [], type(error).__name__
              with ThreadPoolExecutor(max_workers=4) as pool:
                  results = list(pool.map(get, SOURCES))
              return [(s, rows) for s, rows, error in results if not error], {s['id']: error for s, rows, error in results if error}
          
          
          def main():
              now = int(time.time())
              batches, failures = collect(now)
              if '--check-sources' in sys.argv:
                  print(json.dumps({'sources': {s['id']: len(rows) for s, rows in batches}, 'failures': failures}))
                  return bool(failures)
              env = os.environ
              hook = env.get('DISCORD_WEBHOOK_IMPORTANT', '').strip()
              p = urllib.parse.urlsplit(hook)
              if p.scheme != 'https' or p.netloc != 'discord.com' or not re.fullmatch(r'/api/webhooks/\d+/[^/]+', p.path) or p.query or p.fragment:
                  raise ValueError('DISCORD_WEBHOOK_IMPORTANT is missing or invalid')
              api = 'https://api.github.com/repos/' + env['GITHUB_REPOSITORY']
              def gh(path, data=None, method=None):
                  return json.loads(request(api + path, data, {'Authorization': 'Bearer ' + env['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}, method))
              def read(path, branch):
                  obj = gh('/contents/' + path + '?ref=' + urllib.parse.quote(branch, safe=''))
                  return json.loads(base64.b64decode(obj['content'])), obj['sha']
              legacy = {}
              for topic in GAMES:
                  legacy[topic], _ = read(topic + '-state.json', topic + '-monitor-state')
                  if legacy[topic].get('version') != 1 or not isinstance(legacy[topic].get('seen'), list) or not isinstance(legacy[topic].get('sent'), list):
                      raise ValueError('Invalid existing game history')
              legacy['windows'], _ = read('.monitor/windows-state.json', env['DEFAULT_BRANCH'])
              if legacy['windows'].get('version') != 1 or not isinstance(legacy['windows'].get('incidents'), list):
                  raise ValueError('Invalid Windows history')
              try:
                  gh('/git/ref/heads/' + BRANCH)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  gh('/git/refs', {'ref': 'refs/heads/' + BRANCH, 'sha': env['GITHUB_SHA']})
              try:
                  state, sha = read(STATE_PATH, BRANCH)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  if gh('/commits?sha=' + BRANCH + '&path=' + STATE_PATH + '&per_page=1'):
                      raise ValueError('History was deleted; restore it before continuing')
                  state, sha = {'version': 1, 'sources': {}, 'sent': [], 'discovered': {}, 'pending': None}, None
              if state.get('version') != 1 or not isinstance(state.get('sources'), dict) or not isinstance(state.get('sent'), list) or not isinstance(state.get('discovered'), dict):
                  raise ValueError('Invalid important monitor history')
              def save():
                  nonlocal sha
                  payload = {'branch': BRANCH, 'message': 'Update important monitor history [skip ci]',
                             'content': base64.b64encode(json.dumps(state, ensure_ascii=False).encode()).decode()}
                  if sha:
                      payload['sha'] = sha
                  sha = gh('/contents/' + STATE_PATH, payload, 'PUT')['content']['sha']
              if state.get('pending'):
                  raise ValueError('Previous Discord delivery is uncertain; inspect pending history before resuming')
              state, candidates = plan(state, batches, legacy, now)
              state['checked'], state['source_failures'] = now, failures
              if candidates:
                  state['pending'] = {'at': now, 'urls': [item['url'] for item, _, _ in candidates]}
              save()
              if candidates:
                  response = json.loads(request(hook + '?wait=true', {'embeds': [embed(item, label) for item, label, _ in candidates],
                                                                     'allowed_mentions': {'parse': []}}))
                  if not response.get('id'):
                      raise ValueError('Discord response did not confirm delivery')
                  state['last_message_id'], state['pending'] = response['id'], None
                  save()
              summary = '補完監視：取得元 ' + str(len(batches)) + '/' + str(len(SOURCES)) + '、通知 ' + str(len(candidates)) + '件。'
              if failures:
                  summary += '\n取得失敗：' + ', '.join(failures) + '。成功した情報源のみ処理しました。'
              print(summary)
              if env.get('GITHUB_STEP_SUMMARY'):
                  with open(env['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                      f.write(summary + '\n')
              return bool(failures)
          
          
          if __name__ == '__main__':
              try:
                  sys.exit(1 if main() else 0)
              except Exception as error:
                  print('Important monitor stopped: ' + type(error).__name__ + '. Check Secret, source status and saved pending history; no automatic resend.', file=sys.stderr)
                  sys.exit(1)
