name: Overwatch Monitor

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: '通知先とUser IDメンションを接続テスト（同一検証は再送しません）'
        type: boolean
        default: false
      recovery_days:
        description: '再評価期間。通常7日、導入時のみ14日'
        type: choice
        options: ['7', '14']
        default: '7'

permissions:
  contents: write

# All monitors share one durable delivery ledger; serialize its read/modify/write.
concurrency:
  group: discord-monitor-delivery
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify delivery safety
        run: python3 -m unittest -b -q test_monitor
      - name: Check important information
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISCORD_WEBHOOK_IMPORTANT: ${{ secrets.DISCORD_WEBHOOK_IMPORTANT }}
          DISCORD_WEBHOOK_OW: ${{ secrets.DISCORD_WEBHOOK_OW }}
          DISCORD_WEBHOOK_DBD: ${{ secrets.DISCORD_WEBHOOK_DBD }}
          DISCORD_WEBHOOK_APEX: ${{ secrets.DISCORD_WEBHOOK_APEX }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || false }}
          RECOVERY_DAYS: ${{ inputs.recovery_days || '7' }}
        run: python3 monitor.py ow
